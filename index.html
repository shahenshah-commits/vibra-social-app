<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBRA — Connect • Create • Discover</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        vibra: { cyan: '#00f2fe', violet: '#4facfe', dark: '#0a0b10', card: '#13151f', border: '#23263a' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0b10; color: #f3f4f6; overflow-x: hidden; }
        .glass-panel { background: rgba(19, 21, 31, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .vibra-gradient { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9333ea 100%); }
        .vibra-text-gradient { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glow-effect { box-shadow: 0 0 40px -10px rgba(0, 242, 254, 0.25), 0 0 80px -20px rgba(147, 51, 234, 0.2); }
        .blob { filter: blur(80px); animation: float 10s infinite alternate; }
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.9); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col select-none relative bg-[#0a0b10]">

    <!-- Animated Background Blobs -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-cyan-500/20 rounded-full blob pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blob pointer-events-none z-0" style="animation-delay: -5s;"></div>

    <div id="app" class="flex-1 flex flex-col z-10">
        
        <!-- LOGIN & AUTHENTICATION SCREEN -->
        <div id="auth-screen" class="fixed inset-0 z-50 bg-[#0a0b10]/90 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto">
            <div class="glass-panel w-full max-w-md p-8 md:p-10 rounded-[2.5rem] relative glow-effect border border-white/10 my-auto">
                
                <!-- Branding Header -->
                <div class="text-center mb-8">
                    <div class="w-20 h-20 rounded-3xl vibra-gradient mx-auto flex items-center justify-center font-black text-4xl text-[#0a0b10] shadow-2xl shadow-cyan-500/30 mb-4 transform hover:scale-105 transition-transform duration-300">
                        <i data-feather="zap" class="w-10 h-10 text-[#0a0b10]"></i>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Welcome Back to VIBRA</h1>
                    <p class="text-xs font-semibold text-cyan-400 tracking-widest uppercase">Connect • Create • Discover</p>
                </div>
                
                <div id="auth-error" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-2xl text-center"></div>
                
                <!-- Forms Container -->
                <div class="space-y-6">
                    
                    <!-- Login Form -->
                    <form id="login-form" onsubmit="handleEmailLogin(event)" class="space-y-4">
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-gray-300 ml-1">Email or Phone</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500"><i data-feather="mail" class="w-4 h-4"></i></span>
                                <input type="text" id="login-email" required placeholder="name@example.com" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <div class="flex items-center justify-between ml-1">
                                <label class="text-xs font-medium text-gray-300">Password</label>
                                <button type="button" onclick="switchAuthView('forgot')" class="text-xs text-cyan-400 hover:underline">Forgot Password?</button>
                            </div>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500"><i data-feather="lock" class="w-4 h-4"></i></span>
                                <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl pl-11 pr-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                            </div>
                        </div>

                        <button type="submit" class="w-full vibra-gradient text-[#0a0b10] font-extrabold py-4 rounded-2xl shadow-lg shadow-cyan-500/20 hover:opacity-95 transform active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
                            <span>Sign In</span>
                            <i data-feather="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </form>

                    <!-- Register Form (Hidden by default) -->
                    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-gray-300 ml-1">Username</label>
                            <input type="text" id="reg-username" required placeholder="username" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl px-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-gray-300 ml-1">Email</label>
                            <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl px-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-gray-300 ml-1">Password</label>
                            <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl px-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400">
                        </div>
                        <button type="submit" class="w-full vibra-gradient text-[#0a0b10] font-extrabold py-4 rounded-2xl shadow-lg shadow-cyan-500/20 hover:opacity-95 transition-all">Create Account</button>
                    </form>

                    <!-- Forgot Password Form (Hidden by default) -->
                    <form id="forgot-form" onsubmit="handleForgot(event)" class="space-y-4 hidden">
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-gray-300 ml-1">Enter your registered email</label>
                            <input type="email" id="forgot-email" required placeholder="name@example.com" class="w-full bg-[#0a0b10]/80 border border-[#23263a] rounded-2xl px-4 py-3.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-cyan-400">
                        </div>
                        <button type="submit" class="w-full vibra-gradient text-[#0a0b10] font-extrabold py-4 rounded-2xl shadow-lg shadow-cyan-500/20">Send Recovery Link</button>
                        <div class="text-center">
                            <button type="button" onclick="switchAuthView('login')" class="text-xs text-gray-400 hover:text-white">Back to Sign In</button>
                        </div>
                    </form>

                    <div id="auth-switcher" class="pt-2 text-center text-xs text-gray-400">
                        <span id="switcher-text">Don't have an account?</span> 
                        <button onclick="toggleRegisterView()" id="switcher-btn" class="text-cyan-400 font-semibold ml-1 hover:underline">Create Account</button>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-[#23263a]"></div>
                        <span class="flex-shrink mx-4 text-gray-500 text-[10px] uppercase tracking-widest">Or sandbox mode</span>
                        <div class="flex-grow border-t border-[#23263a]"></div>
                    </div>

                    <button onclick="enableDemoMode()" class="w-full bg-[#13151f] border border-[#23263a] hover:border-cyan-500/40 text-white font-semibold py-3.5 rounded-2xl flex items-center justify-center space-x-2 transition-all group">
                        <i data-feather="play-circle" class="w-4 h-4 text-cyan-400 group-hover:scale-110 transition-transform"></i>
                        <span>Continue with Demo Mode</span>
                    </button>
                </div>

                <!-- Footer -->
                <div class="mt-8 text-center text-[10px] text-gray-500 tracking-wider">
                    © 2026 VIBRA • Connect • Create • Discover
                </div>

            </div>
        </div>

        <!-- MAIN APPLICATION INTERFACE (Hidden until logged in) -->
        <div id="main-interface" class="flex-1 flex max-w-7xl mx-auto w-full relative hidden">
            <aside class="hidden md:flex flex-col w-64 border-r border-[#23263a] p-6 sticky top-0 h-screen justify-between bg-[#0a0b10]">
                <div>
                    <div class="flex items-center space-x-3 mb-10">
                        <div class="w-10 h-10 rounded-2xl vibra-gradient flex items-center justify-center font-black text-xl text-[#0a0b10] shadow-lg shadow-cyan-500/20">V</div>
                        <span class="text-2xl font-extrabold tracking-wider vibra-text-gradient">VIBRA</span>
                    </div>
                    <nav class="space-y-2">
                        <button onclick="switchTab('home')" class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400 hover:text-white hover:bg-[#13151f] transition-all"><i data-feather="home" class="w-5 h-5"></i><span>Home</span></button>
                        <button onclick="switchTab('discover')" class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400 hover:text-white hover:bg-[#13151f] transition-all"><i data-feather="compass" class="w-5 h-5"></i><span>Discover</span></button>
                        <button onclick="switchTab('profile')" class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-2xl text-sm font-semibold text-gray-400 hover:text-white hover:bg-[#13151f] transition-all"><i data-feather="user" class="w-5 h-5"></i><span>Profile</span></button>
                    </nav>
                </div>
                <button onclick="logout()" class="flex items-center space-x-3 text-xs text-red-400 text-left px-4 py-3 hover:bg-red-500/10 rounded-2xl transition-all">
                    <i data-feather="log-out" class="w-4 h-4"></i>
                    <span>Sign Out</span>
                </button>
            </aside>
            <main class="flex-1 pb-20 md:pb-0 overflow-y-auto">
                <section id="tab-home" class="max-w-xl mx-auto p-4 space-y-6">
                    <div id="feed-container" class="space-y-6"></div>
                </section>
                <section id="tab-discover" class="max-w-xl mx-auto p-4 space-y-6 hidden">
                    <h2 class="text-lg font-bold">Discover</h2>
                </section>
                <section id="tab-profile" class="max-w-xl mx-auto p-4 space-y-6 hidden">
                    <h2 id="profile-username" class="text-lg font-bold"></h2>
                </section>
            </main>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        let supabaseClient = null;
        try { if(SUPABASE_URL !== 'YOUR_SUPABASE_URL') supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){}

        let sessionUser = JSON.parse(localStorage.getItem('vibra_session')) || null;

        function init() {
            feather.replace();
            if(sessionUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-interface').classList.remove('hidden');
                renderHomeFeed();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        }

        function switchAuthView(view) {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.add('hidden');
            document.getElementById('auth-switcher').classList.add('hidden');

            if(view === 'login') {
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('auth-switcher').classList.remove('hidden');
                document.getElementById('switcher-text').innerText = "Don't have an account?";
                document.getElementById('switcher-btn').innerText = "Create Account";
            } else if(view === 'register') {
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('auth-switcher').classList.remove('hidden');
                document.getElementById('switcher-text').innerText = "Already have an account?";
                document.getElementById('switcher-btn').innerText = "Sign In";
            } else if(view === 'forgot') {
                document.getElementById('forgot-form').classList.remove('hidden');
            }
            feather.replace();
        }

        function toggleRegisterView() {
            const isRegHidden = document.getElementById('register-form').classList.contains('hidden');
            switchAuthView(isRegHidden ? 'register' : 'login');
        }

        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if(supabaseClient) {
                const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
                if(error) { showError(error.message); return; }
                sessionUser = data.user;
            } else {
                sessionUser = { id: 'demo_user', email, user_metadata: { username: email.split('@')[0] } };
            }
            localStorage.setItem('vibra_session', JSON.stringify(sessionUser));
            init();
        }

        async function handleRegister(e) {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const username = document.getElementById('reg-username').value;
            if(supabaseClient) {
                const {data, error} = await supabaseClient.auth.signUp({ email, password, options: { data: { username } } });
                if(error) { showError(error.message); return; }
                sessionUser = data.user;
            } else {
                sessionUser = { id: 'demo_user', email, user_metadata: { username } };
            }
            localStorage.setItem('vibra_session', JSON.stringify(sessionUser));
            init();
        }

        async function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            if(supabaseClient) {
                await supabaseClient.auth.resetPasswordForEmail(email);
            }
            alert('Password reset link sent to ' + email);
            switchAuthView('login');
        }

        function enableDemoMode() {
            sessionUser = { id: 'demo_sandbox_user', email: 'demo@vibra.app', user_metadata: { username: 'vibra_guest', full_name: 'Vibra Guest' } };
            localStorage.setItem('vibra_session', JSON.stringify(sessionUser));
            init();
        }

        function showError(msg) {
            const errBox = document.getElementById('auth-error');
            errBox.innerText = msg;
            errBox.classList.remove('hidden');
        }

        function logout() {
            if(supabaseClient) supabaseClient.auth.signOut();
            localStorage.removeItem('vibra_session');
            sessionUser = null;
            init();
        }

        function switchTab(tab) {
            ['home', 'discover', 'profile'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            if(tab === 'profile') {
                document.getElementById('profile-username').innerText = '@' + (sessionUser?.user_metadata?.username || 'user');
            }
        }

        function renderHomeFeed() {
            const feed = document.getElementById('feed-container');
            feed.innerHTML = `
                <div class="glass-panel p-5 rounded-3xl border border-[#23263a]">
                    <div class="flex items-center space-x-3 mb-4">
                        <div class="w-10 h-10 rounded-full vibra-gradient"></div>
                        <div><h4 class="text-sm font-bold">vibra_official</h4><p class="text-[10px] text-gray-400">Just now</p></div>
                    </div>
                    <div class="w-full h-72 bg-[#0a0b10] rounded-2xl mb-4 flex items-center justify-center text-xs text-gray-500 border border-[#23263a]">[Vibra Dynamic Media Stream]</div>
                    <p class="text-sm">Welcome to VIBRA! Connect • Create • Discover 🚀 #vibra</p>
                </div>
            `;
            feather.replace();
        }

        window.onload = init;
    </script>
</body>
</html>
